<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lectura musical</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <div id="barra-superior">
        <div id="acciones-superiores">
          <button id="boton-atras" class="boton-atras oculto"></button>
          <button id="boton-reiniciar-sesion" class="boton-secundario oculto"></button>
        </div>
        <div id="selector-idioma">
          <button class="boton-idioma" data-lang="es">ES</button>
          <button class="boton-idioma" data-lang="fr">FR</button>
        </div>
      </div>

      <div id="indicador-nivel" class="oculto"></div>

      <div id="menu-programa" class="oculto">
        <h1 id="programa-titulo"></h1>
        <p id="programa-subtitulo"></p>
        <div class="menu-opciones" id="menu-programa-opciones"></div>
      </div>

      <div id="practica-nivel" class="oculto">
        <h2 id="practica-nivel-titulo"></h2>
        <div class="menu-opciones" id="practica-nivel-opciones"></div>
      </div>

      <div id="practica-lista" class="oculto">
        <h2 id="practica-lista-titulo"></h2>
        <p id="practica-lista-objetivo"></p>
        <div id="practica-lista-ejercicios"></div>
        <div id="practica-referencias" class="oculto">
          <h3 id="practica-referencias-titulo"></h3>
          <ul id="practica-referencias-lista"></ul>
        </div>
      </div>

      <div id="practica-ejercicio" class="oculto">
        <h2 id="ejercicio-titulo"></h2>
        <p id="ejercicio-objetivo"></p>
        <div id="ejercicio-partitura"></div>
        <div id="ejercicio-fuente"></div>
        <div id="ejercicio-indicaciones"></div>
      </div>

      <div id="menu-clave" class="oculto">
        <h1 id="portada-titulo"></h1>
        <p id="portada-objetivo"></p>

        <h2 id="menu-clave-titulo"></h2>
        <div class="menu-opciones" id="menu-clave-opciones"></div>

        <div id="portada-info">
          <div class="info-col">
            <h2 id="portada-consiste-titulo"></h2>
            <p id="portada-consiste-texto"></p>
          </div>
          <div class="info-col">
            <h2 id="portada-sesion-titulo"></h2>
            <ol id="portada-sesion-lista"></ol>
          </div>
          <div id="portada-medidas">
            <span id="portada-medidas-titulo"></span>
            <div id="portada-medidas-lista"></div>
          </div>
        </div>
      </div>

      <div id="menu-nivel" class="oculto">
        <h2 id="menu-nivel-titulo"></h2>
        <div class="menu-opciones" id="menu-nivel-opciones"></div>
      </div>

      <div id="marcador">
        <span class="marcador-item marcador-aciertos"><strong id="contador-aciertos">0</strong> <span id="etiqueta-aciertos"></span></span>
        <span class="marcador-item marcador-fallos"><strong id="contador-fallos">0</strong> <span id="etiqueta-fallos"></span></span>
        <span class="marcador-item marcador-racha"><strong id="contador-racha">0</strong> <span id="etiqueta-racha"></span></span>
      </div>

      <div id="indicador-ejercicio" class="oculto"></div>

      <div id="progreso-puntos" class="oculto"></div>

      <div id="controles">
        <button id="boton-estado" class="boton-control"></button>
      </div>

      <div id="memorizacion" class="oculto">
        <p id="memorizacion-texto"></p>
        <div id="contador-regresivo">5</div>
      </div>

      <div id="zona-ejercicio" class="oculto">
        <div id="contenedor-pentagrama">
          <div id="pentagrama"></div>
          <div id="feedback-icono"></div>
        </div>
        <div id="botones"></div>
      </div>

      <div id="resultado" class="oculto">
        <h2 id="resultado-titulo"></h2>
        <div id="resultado-estrellas"></div>
        <p id="leyenda-estrellas"></p>
        <p id="resultado-precision"></p>
        <p id="resultado-detalle"></p>
        <p id="resultado-tiempo"></p>
        <p id="resultado-racha"></p>
        <div id="tabla-sesion-contenedor" class="oculto"></div>
        <button id="boton-continuar" class="boton-control"></button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
